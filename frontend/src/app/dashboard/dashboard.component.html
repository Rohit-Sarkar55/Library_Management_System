<div class="mb-4">
  <h2><i class="bi bi-speedometer2 me-2"></i>Dashboard</h2>
  <p class="text-muted">Welcome to Library Management System</p>
</div>

<!-- Error -->
<div *ngIf="error" class="alert alert-danger">
  {{ error }}
</div>

<!-- Loading -->
<div *ngIf="loading" class="text-center py-4">
  <div class="spinner-border text-primary"></div>
</div>

<!-- Stats cards -->
<div *ngIf="!loading" class="row g-4 mb-4">

  <!-- Total Books -->
  <div class="col-md-3">
    <div class="card border-0 shadow-sm h-100">
      <div class="card-body d-flex align-items-center gap-3">
        <div class="rounded-circle bg-primary bg-opacity-10
          p-3 text-primary">
          <i class="bi bi-book fs-4"></i>
        </div>
        <div>
          <div class="text-muted small">Total Books</div>
          <div class="fs-3 fw-bold">{{ totalBooks }}</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Total Members -->
  <div class="col-md-3">
    <div class="card border-0 shadow-sm h-100">
      <div class="card-body d-flex align-items-center gap-3">
        <div class="rounded-circle bg-success bg-opacity-10
          p-3 text-success">
          <i class="bi bi-people fs-4"></i>
        </div>
        <div>
          <div class="text-muted small">Total Members</div>
          <div class="fs-3 fw-bold">{{ totalMembers }}</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Active Issues -->
  <div class="col-md-3">
    <div class="card border-0 shadow-sm h-100">
      <div class="card-body d-flex align-items-center gap-3">
        <div class="rounded-circle bg-warning bg-opacity-10
          p-3 text-warning">
          <i class="bi bi-arrow-left-right fs-4"></i>
        </div>
        <div>
          <div class="text-muted small">Active Issues</div>
          <div class="fs-3 fw-bold">{{ activeIssues }}</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Overdue -->
  <div class="col-md-3">
    <div class="card border-0 shadow-sm h-100">
      <div class="card-body d-flex align-items-center gap-3">
        <div class="rounded-circle bg-danger bg-opacity-10
          p-3 text-danger">
          <i class="bi bi-exclamation-circle fs-4"></i>
        </div>
        <div>
          <div class="text-muted small">Overdue</div>
          <div class="fs-3 fw-bold">{{ overdueBooks }}</div>
        </div>
      </div>
    </div>
  </div>

</div>

<!-- Quick actions -->
<div class="row g-4">
  <div class="col-12">
    <h5 class="mb-3">Quick Actions</h5>
  </div>

  <div class="col-md-3">
    <a routerLink="/books/new"
      class="card border-0 shadow-sm text-decoration-none h-100">
      <div class="card-body text-center py-4">
        <i class="bi bi-plus-circle fs-2 text-primary mb-2 d-block"></i>
        <div class="fw-semibold">Add Book</div>
      </div>
    </a>
  </div>

  <div class="col-md-3">
    <a routerLink="/members/new"
      class="card border-0 shadow-sm text-decoration-none h-100">
      <div class="card-body text-center py-4">
        <i class="bi bi-person-plus fs-2 text-success mb-2 d-block"></i>
        <div class="fw-semibold">Add Member</div>
      </div>
    </a>
  </div>

  <div class="col-md-3">
    <a routerLink="/transactions/issue"
      class="card border-0 shadow-sm text-decoration-none h-100">
      <div class="card-body text-center py-4">
        <i class="bi bi-book-half fs-2 text-warning mb-2 d-block"></i>
        <div class="fw-semibold">Issue Book</div>
      </div>
    </a>
  </div>

  <div class="col-md-3">
    <a routerLink="/transactions"
      class="card border-0 shadow-sm text-decoration-none h-100">
      <div class="card-body text-center py-4">
        <i class="bi bi-clock-history fs-2 text-danger mb-2 d-block"></i>
        <div class="fw-semibold">View Transactions</div>
      </div>
    </a>
  </div>

</div>

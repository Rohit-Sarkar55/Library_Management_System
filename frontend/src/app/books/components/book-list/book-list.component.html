<div class="d-flex justify-content-between align-items-center mb-4">
  <h2><i class="bi bi-book me-2"></i>Books</h2>
  <a routerLink="/books/new" class="btn btn-primary">
    <i class="bi bi-plus-lg me-1"></i> Add Book
  </a>
</div>

<!-- Success message -->
<div *ngIf="successMessage" class="alert alert-success alert-dismissible">
  {{ successMessage }}
</div>

<!-- Error message -->
<div *ngIf="error" class="alert alert-danger alert-dismissible">
  {{ error }}
</div>

<!-- Search -->
<div class="card mb-4">
  <div class="card-body">
    <div class="row g-2">
      <div class="col-md-3">
        <input type="text" class="form-control"
          placeholder="Search by title"
          [(ngModel)]="searchTitle">
      </div>
      <div class="col-md-3">
        <input type="text" class="form-control"
          placeholder="Search by author"
          [(ngModel)]="searchAuthor">
      </div>
      <div class="col-md-2">
        <input type="text" class="form-control"
          placeholder="Search by ISBN"
          [(ngModel)]="searchIsbn">
      </div>
      <div class="col-md-2">
        <input type="text" class="form-control"
          placeholder="Search by category"
          [(ngModel)]="searchCategory">
      </div>
      <div class="col-md-2 d-flex gap-2">
        <button class="btn btn-primary w-100" (click)="searchBooks()">
          <i class="bi bi-search"></i> Search
        </button>
        <button class="btn btn-secondary w-100" (click)="clearSearch()">
          Clear
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Loading -->
<div *ngIf="loading" class="text-center py-4">
  <div class="spinner-border text-primary"></div>
</div>

<!-- Books table -->
<div *ngIf="!loading" class="card">
  <div class="card-body p-0">
    <table class="table table-hover mb-0">
      <thead class="table-dark">
        <tr>
          <th>#</th>
          <th>Title</th>
          <th>Author</th>
          <th>ISBN</th>
          <th>Category</th>
          <th>Total</th>
          <th>Available</th>
          <th>Shelf</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngIf="books.length === 0">
          <td colspan="9" class="text-center py-4 text-muted">
            No books found
          </td>
        </tr>
        <tr *ngFor="let book of books; let i = index">
          <td>{{ i + 1 }}</td>
          <td>{{ book.title }}</td>
          <td>{{ book.author }}</td>
          <td>{{ book.isbn }}</td>
          <td>{{ book.category }}</td>
          <td>{{ book.totalCopies }}</td>
          <td>
            <span [class]="book.availableCopies > 0 
              ? 'badge bg-success' 
              : 'badge bg-danger'">
              {{ book.availableCopies }}
            </span>
          </td>
          <td>{{ book.shelfLocation || '-' }}</td>
          <td>
            <div class="d-flex gap-1">
              <a [routerLink]="['/books', book.id]"
                class="btn btn-sm btn-outline-primary">
                <i class="bi bi-pencil"></i>
              </a>
              <button class="btn btn-sm btn-outline-danger"
                (click)="deleteBook(book.id)">
                <i class="bi bi-trash"></i>
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

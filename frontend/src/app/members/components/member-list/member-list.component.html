<div class="d-flex justify-content-between align-items-center mb-4">
  <h2><i class="bi bi-people me-2"></i>Members</h2>
  <a routerLink="/members/new" class="btn btn-primary">
    <i class="bi bi-plus-lg me-1"></i> Add Member
  </a>
</div>

<!-- Success message -->
<div *ngIf="successMessage" class="alert alert-success">
  {{ successMessage }}
</div>

<!-- Error message -->
<div *ngIf="error" class="alert alert-danger">
  {{ error }}
</div>

<!-- Loading -->
<div *ngIf="loading" class="text-center py-4">
  <div class="spinner-border text-primary"></div>
</div>

<!-- Members table -->
<div *ngIf="!loading" class="card">
  <div class="card-body p-0">
    <table class="table table-hover mb-0">
      <thead class="table-dark">
        <tr>
          <th>#</th>
          <th>Name</th>
          <th>Email</th>
          <th>Status</th>
          <th>Created At</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngIf="members.length === 0">
          <td colspan="6" class="text-center py-4 text-muted">
            No members found
          </td>
        </tr>
        <tr *ngFor="let member of members; let i = index">
          <td>{{ i + 1 }}</td>
          <td>{{ member.name }}</td>
          <td>{{ member.email }}</td>
          <td>
            <span [class]="member.status === 'ACTIVE'
              ? 'badge bg-success'
              : 'badge bg-secondary'">
              {{ member.status }}
            </span>
          </td>
          <td>{{ member.createdAt | date: 'mediumDate' }}</td>
          <td>
            <div class="d-flex gap-1">
              <a [routerLink]="['/members', member.id]"
                class="btn btn-sm btn-outline-primary">
                <i class="bi bi-pencil"></i>
              </a>
              <button
                class="btn btn-sm btn-outline-warning"
                (click)="deactivateMember(member.id)"
                [disabled]="member.status === 'INACTIVE'">
                <i class="bi bi-person-x"></i>
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
